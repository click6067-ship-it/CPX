      basis: "Harrison PART2: **저칼륨혈증의 장 평활근 마비 작용이 장마비(ileus)를 일으킬 수 있다.** Ch.49 본문: 혈청 칼슘·칼륨·TSH 측정이 드문 대사성 원인 환자를 식별한다. 거대결장이나 하제남용대장 같은 예상 못한 질환이 대장 방사선촬영에서 발견될 수 있으나, 이는 대사장애의 동반증상이 아니라 별도 원인이다(Codex 4라운드 지적). ⚠️ 실사례에 이 진단명 없음 — 2026 사례의 '일반혈액검사·갑상선 검사' 계획이 대사성 배제 축을 부분적으로 담당."

  - id: slow_transit_constipation
    role: differential
    required_symptoms: [infrequent_bowel_movement, no_urge_to_defecate]
    discriminators: [prolonged_colonic_transit, laxative_dependence, hard_lumpy_stool, bloating]
    red_flags: [megacolon, fecal_impaction]
    checklist_items: [ask_bowel_frequency, ask_onset_duration_constipation, ask_digital_or_enema_use, ask_medication_hx, exam_abdomen_percussion, exam_abdomen_palpation]
