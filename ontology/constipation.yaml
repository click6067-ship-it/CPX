  ibs_constipation: 과민성대장증후군(변비형)
  colorectal_cancer_constipation: 대장암
  drug_induced_constipation: 약물유발 변비
  electrolyte_disturbance: 전해질 이상(저칼륨혈증 등)
  hypothyroidism_constipation: 갑상선기능저하증
  hypercalcemia_constipation: 고칼슘혈증
  slow_transit_constipation: 서행성 변비
  anal_fissure: 치열(anal fissure)
  internal_hemorrhoid: 내치핵(internal hemorrhoid)
  neurogenic_constipation: 신경질환성 변비

  # ── 증상·감별단서
  infrequent_bowel_movement: 배변 횟수 감소(주 3회 미만)
  hard_lumpy_stool: 딱딱하고 덩어리진 변
  excessive_straining: 과도한 힘주기
  incomplete_evacuation: 잔변감
  abdominal_discomfort: 복부 불편감
