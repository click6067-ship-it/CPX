      sources: [pusan_cpx_constipation_functional_2026, pusan_cpx_constipation_rectocele_2024, harrison_ch49_diarrhea_constipation]
      basis: "실사례 2건 모두 채점표 진단항목에 **대장암**을 감별로 명시(2026 기능성변비 사례·2024 직장류 사례 — 어느 쪽도 확정진단은 아님). 두 사례 모두 대장암 가족력 문진 항목을 별도 배점. Harrison Ch.49: '최근에 시작된 변비는 대장직장암·항문직장 자극·협착 같은 중대한 기질적 질환의 증상일 수 있다.' Table 49-5 Recent Onset 최상단 'Colonic obstruction — Neoplasm'. 본문: 변비에 체중감소·직장출혈·빈혈이 동반되면 대장직장암이나 협착 배제를 위해 대장내시경(또는 굴곡에스결장경+바륨관장)이 필수."

  - id: drug_induced_constipation
