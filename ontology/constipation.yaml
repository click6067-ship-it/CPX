    education_items: [explain_rectocele_basis, explain_test_purpose, explain_lifestyle_fluid_fiber, explain_laxative_use, explain_followup_after_test]
    evidence:
      level: real_case_direct
      sources: [pusan_cpx_constipation_rectocele_2024, harrison_ch49_diarrhea_constipation]
      basis: "실사례(변비·직장류 2024) 채점표 진단항목=직장류를 최우선 진단으로, 직장탈출증·기능성 변비·(드물게) 대장암을 감별로 설명. 검사=배변조영술(채점표 29번). 문진 2–14(배변시간·힘주기·잔변감·관장 및 손가락 사용·배변 난이도가 달라지는 상황)·진찰 15–23(항문 주변 시진·촉진 + 직장수지검사)이 checklist 출처. Harrison Ch.49: 골반저기능장애는 직장을 완전히 비우지 못함·지속적 직장충만감·손가락으로 변을 빼내야 함·**질 뒤벽에 압력을 가해야 배변(전방 직장류 시사)**·회음부를 받쳐야 함·과도한 힘주기로 시사되며, Table 49-5의 'Disorders of rectal evacuation'에 rectocele이 직접 수록. 배변조영술은 직장류·중첩·직장점막탈출 같은 해부학적 결손을 측정."

  - id: rectal_prolapse
    role: differential
    required_symptoms: [protruding_anal_mass, incomplete_evacuation]
    discriminators: [mucus_discharge, fecal_soiling, excessive_straining, female_with_obstetric_hx]
    red_flags: [incarcerated_prolapse]
    checklist_items: [ask_straining, ask_incomplete_evacuation, ask_digital_or_enema_use, ask_blood_in_stool, exam_perianal_inspection, exam_digital_rectal, exam_strain_simulated_evacuation]
    tests: [defecography, anorectal_manometry]
    education_items: [explain_test_purpose, explain_followup_after_test]
    evidence:
      level: station_differential_listed
      sources: [pusan_cpx_constipation_rectocele_2024, harrison_ch49_diarrhea_constipation]
      basis: "실사례(변비·직장류 2024) 채점표 진단항목에 **직장탈출증**이 감별로 명시(최우선 진단은 직장류이고 이 카드는 확정진단이 아님). Harrison Ch.49 Table 49-5 'Disorders of rectal evacuation'에 rectal mucosal prolapse 수록. 본문: 해부학적 평가의 적응증은 직장점막탈출 증상, 배변을 돕기 위한 질 뒤벽 압박(전방 직장류 시사), 또는 장류를 합병할 수 있는 골반수술력."

  - id: dyssynergic_defecation
    role: differential
    required_symptoms: [excessive_straining, incomplete_evacuation]
    discriminators: [paradoxical_puborectalis_contraction, failure_of_perineal_descent, need_perineal_support, high_anal_sphincter_tone]
    red_flags: [fecal_impaction]
    checklist_items: [ask_straining, ask_defecation_time, ask_incomplete_evacuation, ask_digital_or_enema_use, exam_digital_rectal, exam_strain_simulated_evacuation]
    tests: [anorectal_manometry, balloon_expulsion_test, defecography]
    education_items: [explain_biofeedback, explain_test_purpose, explain_lifestyle_fluid_fiber]
    evidence:
      level: standard_textbook
      real_case: none
      sources: [harrison_ch49_diarrhea_constipation]
      basis: "Harrison Ch.49: 배변 출구폐쇄(배변장애·배변협조장애)는 3차의료에서 변비 환자의 최소 1/4을 차지하며 대장통과 지연을 유발할 수 있고 대개 바이오피드백 재훈련으로 교정. 진료실 간이검사=직장수지검사 중 손가락을 밀어내게 시켜 치골직장근이 뒤로 이동하면 정상, 앞쪽 역설수축이나 회음하강 <1.5cm면 골반저기능장애. 항문직장내압에서 안정기 압력 >80mmHg면 anismus 시사, 풍선배출시간 >60초가 배변장애의 가장 유용한 지표. 골반저기능장애 단독이면 3개월 바이오피드백 성공률 70–80%. ⚠️ 실사례에 이 진단명 자체는 없음(직장류 사례의 문진·진찰 항목이 이 기전을 겨냥)."

  - id: ibs_constipation
    role: differential
