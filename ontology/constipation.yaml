      sources: [harrison_ch49_diarrhea_constipation]
      basis: "⚠️ 실사례 채점표의 **진단·감별 항목에 이 질환명은 없음** — 교과서 근거만. (참고: 검사계획에 갑상선 검사가 있어 내분비 배제 축은 station에 내장되나, 검사 지정이 질환명 명시는 아니므로 승격 근거로 쓰지 않음 — Codex 검수 지적 반영.) Harrison Ch.49 Table 49-5 만성 변비 'Endocrinopathies — Hypothyroidism, hypercalcemia, pregnancy'. 본문: 혈청 칼슘·칼륨·갑상선자극호르몬 측정으로 드문 대사성 원인 환자를 가려낼 수 있음."

  # ⚠️ 2026-08-11 Codex 4라운드 MAJOR("고칼슘혈증·저칼륨혈증·갑상선질환 등 서로 다른 원인을 하나의
  #    질환 카드로 묶음")를 **사용자 지시로** 반영해 분리했다. 지도교수 결정이 아니다.
  - id: hypercalcemia_constipation
    role: differential
    required_symptoms: [polyuria_polydipsia]
    discriminators: [hypercalcemia, muscle_weakness_confusion, infrequent_bowel_movement]
    red_flags: []
    checklist_items: [ask_past_illness, ask_medication_hx, ask_weight_change, ask_neurologic_symptoms]
