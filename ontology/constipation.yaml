    education_items: [explain_test_purpose, explain_lifestyle_fluid_fiber, explain_laxative_use]
    evidence:
      level: standard_textbook
      real_case: none
      sources: [harrison_ch49_diarrhea_constipation]
      basis: "⚠️ 실사례 채점표의 **진단·감별 항목에 이 질환명은 없음** — 교과서 근거만. (참고: 검사계획에 대변통과시간검사가 있어 대장통과 지연 축은 station에 내장되나, 검사 지정이 질환명 명시는 아니므로 승격 근거로 쓰지 않음 — Codex 검수 지적 반영.) Harrison Ch.49 Table 49-5 'Colonic pseudoobstruction — Slow-transit constipation, megacolon'. 본문: 방사선비투과 표지자 검사는 간편·재현성·저비용으로 변비 환자 평가에 널리 쓰이며, 표지자 섭취 5일 후 복부 단순촬영에서 80%가 대장을 빠져나가야 정상. 서행성 변비는 적극적 내과·외과 치료가 필요하고, 배변장애가 통과를 함께 지연시키므로 배변장애 의심 시 항문직장검사를 통과검사보다 먼저."

  - id: anal_fissure
