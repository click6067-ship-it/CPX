# CPX 온톨로지 — 주증상: 변비 (constipation)
# ──────────────────────────────────────────────────────────────
# 이 파일이 정본(master). 편집·검증·버전관리는 여기서만.
# Neo4j/HTML 그래프는 scripts/yaml_to_cypher.py · yaml_to_html.py 로 한 방향 렌더(거울).
#
# 범위 = **임시 12-card teaching set** — 공식 출제범위가 아님.
#   ⚠️ 공식 CPX 감별목록(기본진료수행지침)을 확보하지 못했으므로, 이 12개는 실사례 채점표 + Harrison을
#      근거로 만든 **AI 초안**이다. "변비 station 출제범위"라고 말하지 말 것 — 교수 확인 전까지는
#      교육·구조 시연용 카드 묶음이다. (Codex 검수 지적 반영, 2026-08-11)
# ⚠️ review_status: draft — 임상 내용은 PI·지도교수 검증 전 초안.
#
# 📌 근거 표기(출처·근거 명시): 질환마다 `evidence` 블록.
#    level = real_case_direct(변비 station 실사례의 확정진단 — 기능성변비 2026·직장류 2024)
#          · station_differential_listed(동일 station 실사례 채점표에 감별·검사로 명시, 확정진단 아님)
#          · standard_textbook(사례 언급 없음 — Harrison 원문 근거 초안).
#    변비 station은 실사례가 **2건**(기능성변비·직장류)이라 CPX 주증상 중 근거가 두꺼운 편.
# 설계 정본 = docs/ontology-plan.md · 자료 지형 = docs/source-landscape.md
# ──────────────────────────────────────────────────────────────

chief_complaint: constipation

meta:
  station_minutes: 10
  ppi_assessed: true
  review_status: draft
  professor_approved: false
  scope: cpx_station_differential

# ── 근거 출처 레지스트리 ── (공개 YAML엔 포인터만 — 원문·개인정보 미수록)
sources:
  pusan_cpx_constipation_functional_2026:
    type: real_cpx_case
    ref: "부산대 CPX 사례 '변비(기능성 변비)' 2026 — 로컬·비공개. 변비 station 직접. 채점표 진단항목=기능성 변비를 대표진단으로, 과민성대장증후군·대장암을 감별로 제시하며 근거(배변 횟수·변 양상·복부 불편감)를 함께 설명. 검사계획=일반혈액검사·갑상선 검사·대변통과시간검사·대장내시경."
    grounds: functional_constipation
  pusan_cpx_constipation_rectocele_2024:
    type: real_cpx_case
    ref: "부산대 CPX 사례 '변비(직장류)' 2024 — 로컬·비공개. 변비 station 직접. 채점표 진단항목=직장류를 최우선 진단으로, 직장탈출증·기능성 변비·(드물게) 대장암을 감별로 설명. 검사계획=배변조영술. 문진에 배변시간·힘주기·잔변감·관장/손가락 사용 포함."
    grounds: rectocele
  harrison_ch49_diarrhea_constipation:
    type: textbook
    ref: "Harrison's Principles of Internal Medicine, Ch.49 'Diarrhea and Constipation' (Camilleri M, Murray JA) — Table 49-5(성인 변비의 원인: 최근발생 vs 만성), Fig.49-5(만성 변비 알고리듬), 배변장애 진찰·항문직장내압·풍선배출·배변조영 서술. 로컬 텍스트 코퍼스 직독 — 파일 `cpx-agent/data/raw/textbook/내과/harrison/PART2_Cardinal_Manifestations_and_Presentation_of_Diseases.md`(비공개·저작권, 이 repo 미포함), 챕터 구간 26555–28092행, 원문 페이지마커 [[p220]]–[[p222]]. ⚠️ **원본에 판(edition) 미표기** — 인용 참고문헌 최신 2023년. **basis의 수치는 원문 대조는 마쳤으나 판이 확정되지 않았으므로, 논문·대외 인용 전 원본 PDF로 판·페이지를 확정해야 함.**"
  sabiston_surgery_19th:
    type: textbook
    ref: "Sabiston Textbook of Surgery, 19th ed. — 로컬 텍스트 코퍼스 직독(`외과/Sabiston - Textbook of Surgery 19th Ed.md`, 비공개·저작권, 이 repo 미포함). 인용 구간 = 하부위장관 출혈·항문직장 질환(p1184·p1397), 직장탈출증 증상·변실금(p1375). 판이 원문에 명시되어 있다."
  rosen_em_8th:
    type: textbook
    ref: "Rosen's Emergency Medicine: Concepts and Clinical Practice, 8th ed. — 로컬 텍스트 코퍼스 직독(`응급의학과/Rosen_8th_Full.md`, 비공개·저작권, 이 repo 미포함). 인용 구간 = 항문직장 질환의 통증·출혈 감별(p1461), 변비 대증치료(p323)."
  tintinalli_em_8th:
    type: textbook
    ref: "Tintinalli's Emergency Medicine: A Comprehensive Study Guide, 8th ed. 2016 — 로컬 텍스트 코퍼스 직독(비공개·저작권, 이 repo 미포함). 인용 구간 = 변비의 Rome 기준 '다음 중 2개 이상'(p545). 8판은 판·연도가 원문에 명시되어 있다."
  harrison_part12_endocrine:
    type: textbook
    ref: "Harrison's Principles of Internal Medicine, PART 12 'Endocrinology and Metabolism' — 로컬 텍스트 코퍼스 직독(`내과/harrison/PART12_Endocrinology_and_Metabolism.md`, 비공개·저작권, 이 repo 미포함). 인용 구간 = 갑상선기능저하 증상·징후표 Table 395-3(p52), 갑상선중독증 Table 396-2(p57), 고칼슘혈증 증상·PTH(p105). ⚠️ Harrison은 원본에 판 미표기 — 대외 인용 전 원본 PDF 대조 필요."
  bates_physical_exam:
    type: textbook
    ref: "Bates' Guide to Physical Examination and History Taking — 로컬 텍스트 코퍼스 직독(`공통/Bates_PhysicalExam_HistoryTaking.txt`, 비공개·저작권, 이 repo 미포함). 인용 구간 = 대장암의 배변습관 변화·촉지 종괴(p311·p338), 치열의 이차성 원인(p313), 항문반사 소실과 마미증후군(p380), 마미증후군 경고징후(p463)."

