    red_flags: []
    checklist_items: [ask_onset_duration_constipation, ask_bowel_frequency, ask_stool_form, ask_abdominal_pain, ask_incomplete_evacuation, ask_diet_exercise_habit, exam_abdomen_palpation]
    tests: [cbc_blood_test, colonoscopy]
    education_items: [explain_test_purpose, explain_lifestyle_fluid_fiber]
    evidence:
      level: station_differential_listed
      sources: [pusan_cpx_constipation_functional_2026, harrison_ch49_diarrhea_constipation]
      basis: "실사례(변비·기능성 변비 2026) 채점표 진단항목에 **과민성대장증후군**이 감별로 명시(대표진단은 기능성 변비이고 이 카드는 확정진단이 아님). Harrison Ch.49 Table 49-5 만성 변비 원인 최상단이 'Irritable bowel syndrome — constipation-predominant, alternating'. 본문(설사 절): IBS의 배변 증상은 변비 시기와 교대하고 배변으로 완화되는 복통을 동반하며 체중감소는 드묾. 단순한 잔변감은 IBS에서 흔해, 배변장애를 시사하는 중대한 증상들과 대비됨."

  - id: colorectal_cancer_constipation
    role: differential
    required_symptoms: [recent_onset_constipation]
    discriminators: [change_in_stool_caliber, hematochezia, weight_loss, anemia_symptoms, age_over_50, family_hx_colorectal_cancer]
