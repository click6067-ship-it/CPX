      basis: "Harrison Ch.49 Table 49-5 'Endocrinopathies — Hypothyroidism, **hypercalcemia**, pregnancy'. Harrison PART12: 고칼슘혈증 환자는 무증상이거나 **다뇨·다음·변비·권태·소화불량** 같은 모호한 증상으로 나타나며 신결석도 동반될 수 있다. 핵심 검사는 **혈청(또는 이온화) 칼슘과 PTH** — 생화학 검사에서 고칼슘혈증과 함께 상승한 PTH가 확인된다(Codex 4라운드: 칼륨·TSH는 고칼슘혈증의 필수검사가 아니다). ⚠️ 실사례에 이 진단명 없음."

  - id: electrolyte_disturbance
    role: differential
    required_symptoms: [infrequent_bowel_movement]
    discriminators: [hypokalemia, muscle_weakness_confusion]
    red_flags: [megacolon]
    checklist_items: [ask_past_illness, ask_medication_hx, ask_neurologic_symptoms]
    tests: [serum_calcium_potassium, cbc_blood_test, thyroid_function_test]
