# ── 질환 카드 (대표 기능성 변비 + 감별 11) ───────────────────
diseases:
  - id: functional_constipation
    role: primary
    required_symptoms: [infrequent_bowel_movement, hard_lumpy_stool]
    discriminators: [abdominal_discomfort, low_fiber_low_fluid_intake, sedentary_lifestyle, no_alarm_feature, normal_rectal_exam]
    red_flags: [fecal_impaction, constipation_alarm_features]
    checklist_items: [ask_onset_duration_constipation, ask_bowel_frequency, ask_stool_hardness, ask_blood_in_stool, ask_stool_caliber_change, ask_incomplete_evacuation, ask_abdominal_pain, ask_diet_exercise_habit, ask_smoking_alcohol, ask_family_hx_crc, exam_abdomen_auscultation, exam_abdomen_percussion, exam_abdomen_palpation, exam_digital_rectal, exam_stool_color_on_glove]
    tests: [cbc_blood_test, thyroid_function_test, colonic_transit_study, colonoscopy]
    education_items: [explain_functional_constipation_basis, explain_test_purpose, explain_lifestyle_fluid_fiber]
    disclosure:
      spontaneous: [infrequent_bowel_movement]
      disclose_if_asked: [hard_lumpy_stool, abdominal_discomfort, low_fiber_low_fluid_intake]
    evidence:
      level: real_case_direct
      sources: [pusan_cpx_constipation_functional_2026, harrison_ch49_diarrhea_constipation]
      basis: "실사례(변비·기능성 변비 2026) 채점표 진단항목=기능성 변비를 대표진단으로, 과민성대장증후군·대장암을 감별로 설명하고 근거(배변 횟수·변 양상·복부 불편감)를 제시. 검사=일반혈액검사·갑상선 검사·대변통과시간검사·대장내시경(채점표 21번). 문진 1–11·진찰 12–14 + 직장수지검사가 이 카드의 checklist 출처. Harrison Ch.49: 대부분(>90%)은 기저 원인(암·우울증·갑상선저하)이 없고 충분한 수분·운동·식이섬유(15–25 g/일) 보충에 반응하며, 진찰 특히 직장수지검사는 필수."

  - id: rectocele
    role: differential
    required_symptoms: [incomplete_evacuation, excessive_straining]
    discriminators: [vaginal_pressure_to_defecate, digital_maneuver_to_evacuate, prolonged_defecation_time, female_with_obstetric_hx]
    red_flags: []
    checklist_items: [ask_bowel_frequency, ask_stool_form, ask_defecation_time, ask_straining, ask_incomplete_evacuation, ask_digital_or_enema_use, ask_easy_difficult_situations, ask_blood_in_stool, ask_weight_change, ask_prior_colonoscopy, ask_diet_exercise_habit, ask_past_illness, ask_family_hx_crc, exam_abdomen_auscultation, exam_abdomen_percussion, exam_abdomen_palpation, exam_position_for_rectal, exam_perianal_inspection, exam_digital_rectal]
