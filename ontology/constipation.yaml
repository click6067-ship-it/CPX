    education_items: [explain_lifestyle_fluid_fiber, explain_laxative_use, explain_alarm_symptoms_return]
    evidence:
      level: standard_textbook
      real_case: none
      sources: [harrison_ch49_diarrhea_constipation, sabiston_surgery_19th, rosen_em_8th]
      basis: "Sabiston 19th: 치열은 배변 후 **통증을 동반한 출혈**을 일으키며 출혈이 주 증상인 경우는 오히려 드묾. Rosen 8th: 치열 통증은 날카롭고 갑작스럽게 시작하며 부종을 동반하지 않는 반면, 탈출·혈전 치핵의 통증은 갉는 듯하고 지속적이며 서서히 시작한다. Harrison Ch.49 Table 49-5 Recent Onset 'Anal sphincter spasm — Anal fissure, painful hemorrhoids'; 본문: 항문 자극에 의한 통증이 두려워 변을 참기도 함. ⚠️ **2026-08-11 Codex 임상타당성 검수로 치핵과 분리** — 한 카드에 묶여 있을 때 '무통성 선홍색 출혈'과 '배변통'이 동시에 required로 잡혀 서로 모순됐다. **대장내시경은 이 카드의 일상 검사가 아니라 경고징후 동반 시의 적응증**이라 tests에서 제외. ⚠️ 실사례에 이 진단명 없음."

  - id: internal_hemorrhoid
    role: differential
    required_symptoms: [painless_bright_red_bleeding]
