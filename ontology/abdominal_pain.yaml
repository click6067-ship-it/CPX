# ── 질환 카드 (대표 충수염 + 감별 10) ─────────────────────────
diseases:
  - id: acute_appendicitis
    role: primary
    required_symptoms: [rlq_pain, pain_migration_periumbilical_to_rlq]
    discriminators: [fever_low_grade, anorexia, nausea_vomiting, rebound_tenderness]
    red_flags: [peritoneal_sign, high_fever]
    risk_factors: [young_age]
    checklist_items: [ask_onset_duration, ask_location_migration, ask_associated_fever_gi, exam_rebound_tenderness]
    tests: [abdominal_ct, cbc]
    education_items: [explain_surgery_possibility, explain_npo]
    disclosure:
      spontaneous: [rlq_pain]
      disclose_if_asked: [pain_migration_periumbilical_to_rlq, anorexia]
    evidence:
      level: standard_textbook
      real_case: none          # 부산대 실사례 없음(복통 station 대표지만 사례 미보유)
      note: "표준 교과서 기준 초안 — 교수 검증 필요."

  - id: peptic_ulcer_disease
    role: differential
    required_symptoms: [epigastric_pain, relation_to_meals]
    discriminators: [heartburn, nocturnal_pain, relieved_by_antacid, melena, postprandial_vomiting]
    red_flags: [gi_bleeding, perforation_sign, gastric_cancer_ddx]
    risk_factors: [nsaid_use]
    checklist_items: [ask_meal_relation, ask_heartburn, ask_nsaid_history, ask_alarm_features]
    tests: [egd]
    evidence:
      level: real_case_related
      sources: [pusan_cpx_vomiting_peptic_ulcer_stenosis_2024]
      basis: "실사례(궤양 협착) 진단근거=식후 30–60분 구토·먹은 음식 그대로. 감별진단=위암(경고증상). 검사=내시경·복부CT."
      note: "실사례는 궤양의 협착 합병증(구토 presentation) — 궤양 자체는 교과서 기준. 위암 감별 반영."

  - id: acute_cholecystitis
    role: differential
    required_symptoms: [ruq_pain, worse_after_fatty_meal]
    discriminators: [radiation_to_right_shoulder, murphy_sign, fever_chill, jaundice]
    red_flags: [charcot_triad, high_fever]
    checklist_items: [ask_pain_location_radiation, ask_food_relation, ask_fever_jaundice, exam_murphy_sign]
    tests: [abdominal_ultrasound, lft]
    evidence:
      level: real_case_related
      sources: [pusan_cpx_jaundice_cholangitis_2024]
      basis: "실사례(급성담관염) 진단근거=황달·우상복부통·열감 중 2개(우상복부통 필수). 검사=혈액·영상(CT/US)."
      note: "실사례는 담관염(담도 응급) — 담낭염과 동일 담도계. Murphy·기름진음식 연관은 교과서 기준."

  - id: acute_pancreatitis
    role: differential
    required_symptoms: [epigastric_pain, radiation_to_back]
    discriminators: [worse_lying_better_leaning_forward, persistent_severe_pain, nausea_vomiting, alcohol_or_gallstone_history]
    red_flags: [shock_organ_failure, high_fever]
    risk_factors: [alcohol_use, gallstone_history]
    checklist_items: [ask_pain_location_radiation, ask_alcohol_history, ask_nausea_vomiting, ask_prior_gallstone]
    tests: [serum_lipase_amylase, abdominal_ct]
    evidence:
      level: standard_textbook
      real_case: none
      note: "표준 교과서 기준 초안 — 실사례 없음, 교수 검증 필요."

  - id: gastroenteritis
    role: differential
    required_symptoms: [diffuse_crampy_pain, diarrhea]
    discriminators: [nausea_vomiting, recent_food_or_contact, mild_self_limiting]
    red_flags: [dehydration_sign, bloody_stool]
    checklist_items: [ask_diarrhea, ask_food_history, ask_sick_contacts, ask_dehydration]
    tests: [stool_test]
    evidence:
      level: standard_textbook
      real_case: none
      note: "표준 교과서 기준 초안 — 실사례 없음(설사 station에 과민성대장 사례는 있으나 별개). 교수 검증 필요."

  - id: bowel_obstruction
    role: differential
    required_symptoms: [crampy_abdominal_pain, abdominal_distension]
    discriminators: [vomiting, obstipation, hyperactive_then_absent_bowel_sounds]
    red_flags: [peritoneal_sign, strangulation_sign]
    risk_factors: [prior_abdominal_surgery]
    checklist_items: [ask_bowel_gas_passage, ask_prior_surgery, ask_vomiting, exam_abdominal_distension]
    tests: [abdominal_xray, abdominal_ct]
    evidence:
      level: real_case_related
      sources: [pusan_cpx_vomiting_bowel_obstruction_2026, sabiston_surgery]
      basis: "실사례(구토·장폐색) 기반. 참고문헌=Sabiston Textbook of Surgery. 구토·복부팽만·배변가스 중단·수술과거력."
      note: "실사례는 구토 station의 장폐색 — 동일 질환."

  - id: diverticulitis
    role: differential
    required_symptoms: [llq_pain, fever]
    discriminators: [altered_bowel_habit, localized_tenderness]
    red_flags: [peritoneal_sign, perforation_sign]
    risk_factors: [older_age]
    checklist_items: [ask_pain_location, ask_bowel_habit_change, ask_fever, exam_llq_tenderness]
    tests: [abdominal_ct]
    evidence:
      level: standard_textbook
      real_case: none
      note: "표준 교과서 기준 초안 — 실사례 없음, 교수 검증 필요."

  - id: ureteral_stone
    role: differential
    # ⬇ 실제 부산대 CPX 사례(급성복통·요로결석, 2024)로 근거 보강. 원문·개인정보 미포함(포인터만).
    required_symptoms: [flank_pain, sudden_severe_pain]
    discriminators: [cva_tenderness, position_independent_pain, hematuria, radiation_to_groin]
    red_flags: [obstruction_pyelonephritis, acute_kidney_injury]
    risk_factors: [dehydration]
    checklist_items: [ask_onset_duration, ask_pain_location_radiation, ask_character, ask_fever_chill, ask_urinary_symptoms, ask_pregnancy_menstruation, exam_cva_tenderness]
    tests: [urinalysis, pregnancy_test_hcg, blood_test, kub_xray, stone_ct]
    education_items: [explain_analgesia_first, explain_stone_treatment, explain_obstruction_emergency]
    evidence:
      level: real_case_direct        # 복통 station 실사례 직접
      sources: [pusan_cpx_abdominal_ureteral_stone_2024, urology_textbook_6ed]
      key_finding: cva_tenderness    # 사례 진단 결정 소견(갈비척추각압통)
      basis: "실사례 진단근거=갑작스런 측복통 + 갈비척추각압통 + 무발열/무오한 + 무배뇨증상 + 무임신가능성 → 요로결석. 검사=소변(hCG포함)·혈액·X-ray/CT. 교육=진통제 우선·수분/ESWL/수술·폐색합병증."
      unsourced: [radiation_to_groin]  # 사례엔 측복부·등 방사만 명시 → 서혜부방사는 교과서 일반(정직 표기)

