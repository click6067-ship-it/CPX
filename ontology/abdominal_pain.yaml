# CPX 온톨로지 — 주증상: 복통 (abdominal pain)
# ──────────────────────────────────────────────────────────────
# 이 파일이 정본(master). 편집·검증·버전관리는 여기서만.
# Neo4j/HTML 그래프는 scripts/yaml_to_cypher.py · yaml_to_html.py 로 한 방향 렌더(거울).
#
# 범위 = **CPX 복통 station 출제범위 수준(~11 질환)**. 전체 의학감별(30+) 아님.
# ⚠️ review_status: draft — 질환 목록·감별은 표준 교과서 기준 초안. 공식 출제범위 확정 =
#    기본진료수행지침(스캔·OCR 불가/미완) 또는 교수 확인 후.
#
# 📌 근거 표기(출처·근거 명시): 질환마다 `evidence` 블록.
#    level = real_case_direct(복통 station 실사례) · real_case_related(동일질환·타 주증상 station 실사례)
#          · standard_textbook(실사례 없음, 표준지식 초안).
#    실사례 근거는 부산대 CPX 실 사례 채점표에서 확인. 원문·개인정보는 미수록(포인터만).
# 설계 정본 = docs/ontology-plan.md · 자료 지형 = docs/source-landscape.md
# ──────────────────────────────────────────────────────────────

chief_complaint: abdominal_pain

meta:
  station_minutes: 10
  ppi_assessed: true
  review_status: draft
  professor_approved: false
  scope: cpx_station_differential

# ── 근거 출처 레지스트리 (evidence 블록이 참조) ──
# ⚠️ 공개 YAML엔 포인터만 — 사례 원문·개인정보(이름·연락처·SP 페르소나) 미수록.
sources:
  pusan_cpx_abdominal_ureteral_stone_2024:
    type: real_cpx_case
    ref: "부산대 CPX 사례 '급성복통(요로결석)' 2024 — 로컬·비공개. **복통 station 직접**."
    grounds: ureteral_stone
  urology_textbook_6ed:
    type: textbook
    ref: "비뇨의학 제6판 Ch.17 요로결석 p.179–195, 일조각, 2019 (요로결석 사례 인용문헌)"
  pusan_cpx_vomiting_bowel_obstruction_2026:
    type: real_cpx_case
    ref: "부산대 CPX 사례 '구토(장폐색)' 2026 — 로컬·비공개. 구토 station(동일 질환)."
    grounds: bowel_obstruction
  sabiston_surgery:
    type: textbook
    ref: "Sabiston Textbook of Surgery: The Biological Basis of Modern Surgical Practice (장폐색 사례 인용문헌)"
  pusan_cpx_vomiting_peptic_ulcer_stenosis_2024:
    type: real_cpx_case
    ref: "부산대 CPX 사례 '구토(소화성궤양 협착)' 2024 — 로컬·비공개. 구토 station(궤양 합병증). 진단근거=식후 30–60분 구토·먹은음식 그대로, 감별=위암. (참고문헌 미기재)"
    grounds: peptic_ulcer_disease
  pusan_cpx_jaundice_cholangitis_2024:
    type: real_cpx_case
    ref: "부산대 CPX 사례 '황달(급성담관염)' 2024 — 로컬·비공개. 담도 응급(담낭염과 동일 담도계). 진단근거=황달·우상복부통·열감(우상복부통 필수). (참고문헌 미기재)"
    grounds: acute_cholecystitis
  pusan_cpx_fever_pyelonephritis_2023:
    type: real_cpx_case
    ref: "부산대 CPX 사례 '발열(신우신염)' 2023 — 로컬·비공개. 발열 station(동일 질환). 진단근거=발열·우측 갈비척추각압통(CVA), 감별=뇌수막염·장염. (참고문헌 미기재)"
    grounds: pyelonephritis

