  fever_present: 발열
  outbreak_contact: 집단발생·주변 동일증상
  # 침습성 세균성 / 이질 (2026-08-11 Codex 지적으로 카드 분리)
  inflammatory_diarrhea: 염증성(침습성) 설사 — 혈변·발열 동반
  bloody_diarrhea: 혈성 설사(이질)
