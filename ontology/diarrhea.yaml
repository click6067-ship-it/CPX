# CPX 온톨로지 — 주증상: 설사 (diarrhea)
# ──────────────────────────────────────────────────────────────
# 이 파일이 정본(master). 편집·검증·버전관리는 여기서만.
# Neo4j/HTML 그래프는 scripts/yaml_to_cypher.py · yaml_to_html.py 로 한 방향 렌더(거울).
#
# 범위 = **임시 12-card teaching set** — 공식 출제범위가 아님.
#   ⚠️ 공식 CPX 감별목록(기본진료수행지침)을 확보하지 못했으므로, 이 12개는 실사례 채점표 + Harrison을
#      근거로 만든 **AI 초안**이다. "설사 station 출제범위"라고 말하지 말 것 — 교수 확인 전까지는
#      교육·구조 시연용 카드 묶음이다. (Codex 검수 지적 반영, 2026-08-11)
# ⚠️ review_status: draft — 임상 내용은 PI·지도교수 검증 전 초안.
#
# 📌 근거 표기(출처·근거 명시): 질환마다 `evidence` 블록.
#    level = real_case_direct(설사 station 실사례의 확정진단)
#          · station_differential_listed(동일 station 실사례 채점표에 감별·문진 대상으로 명시, 확정진단 아님)
#          · standard_textbook(사례 언급 없음 — Harrison 원문 근거 초안).
#    실사례 근거는 부산대 CPX 실 사례 채점표에서 확인. 원문·개인정보 미수록(포인터만).
# 설계 정본 = docs/ontology-plan.md · 자료 지형 = docs/source-landscape.md
# ──────────────────────────────────────────────────────────────

chief_complaint: diarrhea

meta:
  station_minutes: 10
  ppi_assessed: true
  review_status: draft
  professor_approved: false
  scope: cpx_station_differential

# ── 근거 출처 레지스트리 ── (공개 YAML엔 포인터만 — 원문·개인정보 미수록)
sources:
  pusan_cpx_diarrhea_ibs_2022:
    type: real_cpx_case
    ref: "부산대 CPX 사례 '설사(과민성대장증후군)' 2022 — 로컬·비공개. 설사 station 직접. 채점표 진단항목의 근거 요지=복통 동반·증상 지속기간·기질적 질환 가능성 낮음. 검사계획=혈액검사·대변검사·결장경."
    grounds: ibs_diarrhea
  harrison_ch49_diarrhea_constipation:
    type: textbook
    ref: "Harrison's Principles of Internal Medicine, Ch.49 'Diarrhea and Constipation' (Camilleri M, Murray JA) — Table 49-2(급성 감염성 설사: 병태생리↔임상소견), Table 49-3(만성 설사 기전별 원인), Table 49-4(만성 설사 진찰), Fig.49-3/49-4(알고리듬). 로컬 텍스트 코퍼스 직독 — 파일 `cpx-agent/data/raw/textbook/내과/harrison/PART2_Cardinal_Manifestations_and_Presentation_of_Diseases.md`(비공개·저작권, 이 repo 미포함), 챕터 구간 26555–28092행, 원문 페이지마커 [[p211]]–[[p222]]. ⚠️ **원본에 판(edition) 미표기** — 인용 참고문헌 최신 2023년. **basis의 수치는 원문 대조는 마쳤으나 판이 확정되지 않았으므로, 논문·대외 인용 전 원본 PDF로 판·페이지를 확정해야 함.**"
  rosen_em_8th:
    type: textbook
    ref: "Rosen's Emergency Medicine: Concepts and Clinical Practice, 8th ed. — 로컬 텍스트 코퍼스 직독(`응급의학과/Rosen_8th_Full.md`, 비공개·저작권, 이 repo 미포함). 이 파일에서 인용한 구간 = 급성 설사 접근(p314·p316), 식품매개질환 병원체·잠복기 표(p1425), 항문직장 질환(p1461), 소아 감염성 설사 치료표(p2492). 인용문은 `scripts/findings_review.py`가 원문 대조하며, 페이지는 원문 `[[pN]]` 마커에서 기계가 딴다."
  tintinalli_em_8th:
    type: textbook
    ref: "Tintinalli's Emergency Medicine: A Comprehensive Study Guide, 8th ed. 2016 — 로컬 텍스트 코퍼스 직독(`응급의학과/Tintinallis Emergency Medicine ... 8th 2016.md`, 비공개·저작권, 이 repo 미포함). 인용 구간 = 지사제 금기(p539), 변비 Rome 기준(p545), 감염성 설사 병원체 임상양상표(p892), 소아 설사·HUS(p930), 급성 설사 분류·STEC 항생제 금기·처치기준(p1123–p1125). 8판은 **판·연도가 원문에 명시**되어 있어 Harrison(판 미확정)과 달리 대외 인용에 바로 쓸 수 있다."

# 표시용 한국어 라벨 (id → 한국어). 그래프 렌더가 이걸 씀. 없으면 id 그대로.
