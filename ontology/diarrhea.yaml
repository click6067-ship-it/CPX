  overtly_bloody_stool: 육안적 혈변
  duration_over_48h_no_improvement: 48시간 이상 호전 없음
  hemolytic_uremic_syndrome: 용혈요독증후군(HUS)
  stec_antibiotic_contraindication: STEC 의심 시 항생제·지사제 금기
  elderly_or_immunocompromised: 고령(≥70세)·면역저하
  severe_pain_over_age_50: 50세 초과에서 심한 복통
  fecal_incontinence: 변실금(변을 지림)
  toxic_megacolon: 독성 거대결장
  bowel_obstruction_sign: 장폐색 징후

  # ── 병력청취 채점항목 (실사례 채점표 기반)
  ask_onset_duration_diarrhea: 언제부터 설사했는지 묻기
  ask_stool_frequency: 설사 빈도 묻기
  ask_stool_form: 변의 형태 묻기
  ask_stool_volume: 변의 양 묻기
  ask_fecal_incontinence: 변 지리는지 묻기
  ask_blood_or_color: 변 색깔·혈변 묻기
  ask_weight_loss: 체중감소 묻기
  ask_fever_chills: 발열·오한 묻기
  ask_thirst_dehydration: 갈증·탈수 묻기
  ask_abdominal_surgery_hx: 복부수술(담낭절제) 과거력 묻기
  ask_hyperthyroid_symptoms: 갑상선기능항진 증상 묻기
  ask_recent_travel: 최근 여행·타지역 방문 묻기
  ask_food_relation: 음식과 증상 연관성 묻기
  ask_pain_with_diarrhea: 설사 시 복통 묻기
  ask_pain_onset: 복통 시작 시기 묻기
  ask_pain_relief: 복통 호전 상황 묻기
