  shigellosis_dysentery: 세균성 이질(Shigella)
  stec_infection: 장출혈성 대장균(STEC·O157:H7) 감염
  preformed_toxin_food_poisoning: 전구성 독소 식중독(황색포도알균·B. cereus 구토독소)
  in_vivo_toxin_food_poisoning: 정착 후 독소생성 식중독(C. perfringens 등)
  travelers_diarrhea: 여행자 설사
  cdi_antibiotic_associated: 항생제연관 설사(C. difficile)
  inflammatory_bowel_disease: 염증성 장질환(크론·궤양성대장염)
