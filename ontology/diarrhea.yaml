  ask_antibiotic_hx: 최근 항생제 사용 묻기
  ask_family_hx: 가족력 묻기
  ask_dairy_relation: 유제품 섭취 연관 묻기

  # ── 신체진찰 채점항목
  exam_dehydration_tongue: 탈수 평가(혀·구강)
  exam_thyroid: 갑상샘 진찰
  exam_abdomen_auscultation: 복부 청진
  exam_abdomen_percussion: 복부 타진
  exam_abdomen_palpation: 복부 촉진
  exam_digital_rectal: 항문·직장 진찰

  # ── 검사
  cbc_blood_test: 혈액검사
  stool_study: 대변검사
  colonoscopy: 결장경(대장내시경)
  stool_culture_pcr: 대변 배양·분자검사
  cdiff_toxin_assay: C. difficile 독소검사
  thyroid_function_test: 갑상선기능검사
  lactose_breath_test: 유당 호기검사
  fecal_calprotectin: 대변 칼프로텍틴
  serum_electrolytes: 혈청 전해질

  # ── 환자교육
  explain_ibs_diagnosis_basis: 과민성대장증후군 진단 근거 설명
  explain_test_purpose: 검사 목적 설명
  explain_oral_rehydration: 경구 수분·전해질 보충 교육
  explain_red_flag_return: 재방문 필요 위험징후 설명
  explain_dietary_modification: 식이조절 교육
  explain_hand_hygiene_transmission: 전파 예방·손위생 교육

# ── 질환 카드 (대표 IBS-D + 감별 11) ─────────────────────────
diseases:
  - id: ibs_diarrhea
    role: primary
    required_symptoms: [chronic_recurrent_diarrhea, abdominal_pain_with_diarrhea]
    discriminators: [pain_relieved_by_defecation, no_nocturnal_symptoms, stress_related_symptoms, alternating_constipation, no_weight_loss]
    red_flags: []
    checklist_items: [ask_onset_duration_diarrhea, ask_stool_frequency, ask_stool_form, ask_stool_volume, ask_pain_with_diarrhea, ask_pain_onset, ask_pain_relief, ask_stress_relation, exam_abdomen_auscultation, exam_abdomen_percussion, exam_abdomen_palpation, exam_digital_rectal]
    tests: [cbc_blood_test, stool_study, colonoscopy]
    education_items: [explain_ibs_diagnosis_basis, explain_test_purpose, explain_dietary_modification]
    disclosure:
      spontaneous: [chronic_recurrent_diarrhea]
      disclose_if_asked: [abdominal_pain_with_diarrhea, pain_relieved_by_defecation, stress_related_symptoms]
    evidence:
      level: real_case_direct
      sources: [pusan_cpx_diarrhea_ibs_2022, harrison_ch49_diarrhea_constipation]
      basis: "실사례(설사·과민성대장증후군) 채점표 진단항목의 근거 요지=복통 동반·증상 지속기간·기질적 질환 가능성 낮음. 검사=혈액·대변·결장경(채점표 25번). 문진 채점항목 1–17·진찰 18–23이 이 카드의 checklist 출처. Harrison Ch.49 Dysmotile Causes: IBS는 배변으로 완화되는 복통을 동반하고, 배변 횟수 증가는 대개 야간에 멈추며, 변비와 교대하고, 체중감소는 드묾."

  - id: viral_gastroenteritis
    role: differential
    required_symptoms: [acute_watery_diarrhea]
    discriminators: [vomiting_prominent, fever_present, outbreak_contact, crampy_abdominal_pain]
    red_flags: [dehydration_signs, elderly_or_immunocompromised]
    checklist_items: [ask_onset_duration_diarrhea, ask_stool_frequency, ask_fever_chills, ask_thirst_dehydration, exam_dehydration_tongue, exam_abdomen_palpation]
    tests: [stool_study, serum_electrolytes]
    education_items: [explain_oral_rehydration, explain_hand_hygiene_transmission, explain_red_flag_return]
    evidence:
      level: standard_textbook
      real_case: none
      sources: [harrison_ch49_diarrhea_constipation]
      basis: "Harrison Ch.49: 급성 설사의 90% 초과가 감염성이며 구토·발열·복통을 동반. Table 49-2 'Invasive organisms — minimal inflammation: Rotavirus and norovirus' 잠복기 1–3일, 구토 1–3+, 복통 2–3+, 발열 3–4+, 물설사 1–3+. ⚠️ 'Invasive organisms'는 **Harrison 표의 분류 그대로**이며(하위 구분 = minimal inflammation), 로타·노로가 병태생리적으로 점막 침습성이라는 뜻이 아니다 — 오독 주의. 크루즈선 등 노로바이러스 집단발생 명시. ⚠️ 설사 station 실사례에 이 진단명은 없음 — 채점표 8번(발열·오한)·9번(탈수) 문진이 이 감별을 겨냥."

  - id: invasive_bacterial_enterocolitis
    role: differential
    required_symptoms: [inflammatory_diarrhea]
    discriminators: [high_fever, severe_abdominal_pain, fecal_leukocytes]
    red_flags: [fever_over_38_5, toxic_megacolon]
    checklist_items: [ask_onset_duration_diarrhea, ask_blood_or_color, ask_fever_chills, ask_food_relation, exam_abdomen_palpation, exam_digital_rectal]
    tests: [stool_culture_pcr, stool_study, cbc_blood_test]
    education_items: [explain_test_purpose, explain_red_flag_return]
    evidence:
      level: standard_textbook
      real_case: none
      sources: [harrison_ch49_diarrhea_constipation, tintinalli_em_8th]
      basis: "Harrison Ch.49 Table 49-2 'Invasive organisms': Salmonella·Campylobacter·Yersinia(잠복 12h–11d, 발열 3–4+, 물 또는 혈성). Yersinia는 말단회장·근위대장 침범으로 급성 충수염과 혼동될 심한 복통·압통. Tintinalli 8th: 'Inflammatory diarrhea (grossly bloody, fever)' 군에 Shigella·Campylobacter·Salmonella·EIEC·STEC. ⚠️ **2026-08-11 Codex 임상타당성 검수로 이질을 별도 카드(shigellosis_dysentery)로 분리** — 혈성 설사는 모든 세균성 장염의 required가 아니라 이질형에 한정되고, 발열·복통도 침습감염에서 항상 동반되지는 않아 discriminator로 내렸다. ⚠️ 실사례에 이 진단명 없음 — 채점표 6번(혈변)·8번(발열) 문진이 겨냥."

  - id: shigellosis_dysentery
