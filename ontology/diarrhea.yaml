  urgency_after_meals: 식후 급박변
  # 대장암
  change_in_stool_caliber: 변 굵기 변화
  hematochezia: 혈변
  anemia_symptoms: 빈혈 증상(피로·창백)
  age_over_50: 50세 이상
  family_hx_colorectal_cancer: 대장암 가족력
  # 약물유발
  temporal_relation_to_drug: 약물 시작과 시간적 연관
