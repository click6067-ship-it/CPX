        method: "-"
        status: NOT_RUN
        detail: >-
          **BLOCKER만 즉시 반영했고 MAJOR 122·MINOR 4는 미반영이다.** 원문 = 바탕화면
          `CPX_설사변비_온톨로지_260811/Codex검수4_*.md`. 성격상 세 덩어리다 —
          ① **추가 분리 요구**(Campylobacter/Salmonella/Yersinia 분기, Crohn/UC 분리,
          고칼슘혈증·전해질·내분비 변비 분리, 약물유발 설사의 약물군별 분리): 카드 수가 CPX 교육용
          범위를 넘어설 수 있어 **교수 판단이 필요한 설계 결정**이다. 임의로 늘리지 않았다.
          ② **Rome IV 기준 정밀화**(6개월 조건·"2개 이상"·subtype 변 형태 비율): 현재 인용은
          Tintinalli의 축약형 Rome 기준이라 Rome IV 원문 확보가 선행되어야 한다.
          ③ **경보징후 보강**(기능성 변비의 혈변·체중감소·빈혈, 신경질환성 변비의 마미증후군,
          CDI의 전격성 징후 등): 교재 채굴로 바로 채울 수 있는 부분 — 다음 라운드 최우선.

  - date: "2026-08-11 (5라운드)"
