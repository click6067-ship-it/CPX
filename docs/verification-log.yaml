        method: "원문에서 인용 앞뒤 글자가 실제로 이어지는지 보고, 잘린 것만 문장·단어 경계까지 확장"
        status: PASS
        detail: >-
          'ience a sudden onset…'(=experience) · 'ld be formally evaluated'(=should) · 's cause painless,
