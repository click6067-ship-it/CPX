          `crohn_disease`(반복 우하복부 통증 + **항문주위 병변 1/3** — UC와의 핵심 감별점).
          ③ `drug_induced_diarrhea` → 현미경적 대장염을 별도 카드로 분리.
          ④ `metabolic_hypercalcemia` → `hypercalcemia_constipation`(다뇨·다음·PTH) /
          `electrolyte_disturbance`(저칼륨혈증의 장마비).
          🐛 분리 중 **id 충돌을 자체 발견** — 새 질환 id `hypercalcemia`가 기존 **증상 라벨** `hypercalcemia`와
