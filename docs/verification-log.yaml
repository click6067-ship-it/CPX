          지우지 않고 **분리**했다(교재 근거로서는 가치가 있으나 발현소견은 아니므로).
          결과: 발현소견 127→91, 참고항목 83 신설. role 분포도 정상화 —
          설사 required 14·discriminator 21·supporting 26·red_flag 9 / 변비 required 11·discriminator 9·supporting 21·red_flag 2.
          (이전에는 required가 남발돼 "그 질환이면 거의 항상 있는 소견"이라는 정의가 무의미했다.)

      - name: "질환 카드 분리 (24 → 27)"
        method: "검토표와 ontology YAML 양쪽에서 분리 + cypher·그래프·리포트 재생성"
        status: PASS
