          **따라서 이 분리는 임상 권위자의 결정이 아니라 사용자 지시에 따른 개발 담당의 실행이다.**
          공식 감별목록(기본진료수행지침) 확보 후 반드시 재검토해야 하며, 각 카드의 `basis`에도
          "사용자 지시로 분리"를 명시했다. 교수 보고 시 이 점을 먼저 말해야 한다.

      - name: "추가 질환 분리 (설사 15→19 · 변비 13→14)"
        method: "검토표 + ontology YAML 동시 분리 후 cypher·그래프·리포트 재생성"
        status: PASS
        detail: >-
          Codex 4라운드 MAJOR가 요구한 분리 중 **임상적 근거가 교재로 확보되는 것**만 실행했다.
          ① `invasive_bacterial_enterocolitis` → `campylobacter_enteritis`(설사·혈변·복통·발열, 잠복 2~10일,
          가금류·반려동물 노출) / `nontyphoidal_salmonella`(식품매개·파충류, **건강 성인에게는 항생제 금지**) /
