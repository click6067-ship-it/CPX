          검증 스크립트에 **질환 id ↔ 증상 라벨 충돌 검사**를 추가했다.

      - name: "경보징후(red flag) 보강"
        method: "Rosen 8th·Bates·Harrison 신규 채굴 후 검토표·YAML 양쪽 반영"
        status: PASS
        detail: >-
