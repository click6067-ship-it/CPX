      - name: "🐛 인용 페이지 산출 버그 수정 (findings_review.resolve)"
        method: "페이지 마커 경계 기준 누적 인덱스로 교체 + 원문공간 독립 계산과 143건 교차검증"
        status: PASS
        detail: >-
          **기존 인용 150건 중 54건(36%)의 페이지가 틀려 있었다.** 원인은 squash 인덱스를 원문 인덱스로
          되돌릴 때 `[[pN]]` 마커의 글자까지 함께 센 것 — 마커는 squash 코퍼스에 없으므로 마커 1개당 약 7자씩
          오차가 누적됐고(Tintinalli 1124번째 마커에서 약 7,900자 ≈ 2페이지), **뒤쪽 페이지일수록 인용 페이지가
          앞으로 밀려 찍혔다.** 실측 차이는 +1페이지 43건·+3 3건·+4 5건·+5 3건(항상 실제보다 앞).
          교차검증(원문 공간에서 직접 계산) 143/143 일치로 수정 확인. 책(book) 표기는 변경 0건.
          같은 맥락으로 `verify()`의 "일치 @파일"과 `resolve()`의 출처가 서로 다른 파일을 가리킬 수 있던
